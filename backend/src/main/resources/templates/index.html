<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${systemName}">学生信息管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 80px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        h1 {
            color: #2d3748;
            font-size: 42px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .version {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .description {
            color: #718096;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
            text-align: left;
        }

        .feature-item {
            background: #f7fafc;
            padding: 15px 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .feature-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .feature-item::before {
            content: "✓";
            color: #667eea;
            font-weight: bold;
            margin-right: 10px;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 18px 50px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
        }

        .footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e2e8f0;
            color: #a0aec0;
            font-size: 14px;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .tech-stack {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .tech-badge {
            background: #edf2f7;
            color: #4a5568;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 32px;
            }

            .btn {
                padding: 15px 40px;
                font-size: 16px;
            }

            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎓</div>
        
        <h1 th:text="${systemName}">学生信息管理系统</h1>
        
        <span class="version" th:text="${systemVersion}">v1.0.0</span>
        
        <p class="description" th:text="${description}">
            基于Spring Boot + Vue3的高性能学生信息管理系统
        </p>

        <div class="features">
            <div class="feature-item">JWT + Redis 认证</div>
            <div class="feature-item">RBAC 权限控制</div>
            <div class="feature-item">Redis ZSet 排名</div>
            <div class="feature-item">Kafka 异步日志</div>
            <div class="feature-item">AOP 接口监控</div>
            <div class="feature-item">Docker 容器化</div>
        </div>

        <div class="btn-container">
            <a href="http://localhost:3002" class="btn btn-primary">
                🚀 进入管理系统
            </a>
            <a href="/about" class="btn btn-secondary">
                📖 了解更多
            </a>
        </div>

        <div class="tech-stack">
            <span class="tech-badge">Spring Boot 3.x</span>
            <span class="tech-badge">Vue 3</span>
            <span class="tech-badge">Thymeleaf</span>
            <span class="tech-badge">MySQL 8.0</span>
            <span class="tech-badge">Redis</span>
            <span class="tech-badge">Kafka</span>
        </div>

        <div class="footer">
            <p>当前时间: <span th:text="${currentTime}">2024-01-01 12:00:00</span></p>
            <p>
                <a href="/notice">系统公告</a> |
                <a href="/about">关于系统</a> |
                <a href="http://localhost:8080" target="_blank">Kafka监控</a>
            </p>
            <p style="margin-top: 15px;">© 2024 学生信息管理系统. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
